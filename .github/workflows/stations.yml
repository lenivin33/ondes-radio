name: Liste des radios

# Chaque lundi à 4 h (UTC), régénère stations.json depuis l'annuaire Radio Browser.
# Le site est publié depuis la branche gh-pages : après chaque mise à jour de main
# (liste de la semaine ou modification poussée), gh-pages est alignée sur main.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 20
      - name: Générer stations.json
        if: github.event_name != 'push'
        run: node tools/build-stations.cjs
      - name: Publier la liste sur main si elle a changé
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- stations.json; then
            echo "Liste inchangée"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git commit -m "Liste des radios : mise à jour hebdomadaire"
          git push origin HEAD:main
      # Sans --force : si gh-pages contient des modifications absentes de main, l'étape échoue au lieu de les effacer.
      - name: Aligner gh-pages sur main
        run: git push origin HEAD:refs/heads/gh-pages
